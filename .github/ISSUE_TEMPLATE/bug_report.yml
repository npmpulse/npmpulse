name: Bug report
description: Something is broken or shows a wrong number.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the "Data quirks" section of the
        README first — some odd-looking charts are npm's data, not a bug here.
  - type: input
    id: url
    attributes:
      label: The URL
      description: The full address, which already encodes the packages, range and scale.
      placeholder: https://npmpulse.com/?q=react,vue&range=5y&scale=log
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: The chart should…
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the exact message or, for a chart, what it drew instead.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - The interactive chart (npmpulse.com)
        - The embed endpoint (/api/svg, e.g. in a README)
        - A generated page (/<package>, /compare/*, /data/*)
        - The build or the test suite
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, or `node --version` and `pnpm --version` for build issues.
    validations:
      required: false
