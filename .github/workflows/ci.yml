name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Keep in sync with the local pnpm. 11.13.0 was yanked as a broken
          # release and action-setup refuses to install it.
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: License headers
        # Every source file carries the MIT header; a new file that was never
        # stamped fails here rather than quietly shipping unlicensed.
        run: pnpm license:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        # The coverage thresholds in vitest.config.ts fail this step, which is
        # the mechanism that keeps the floor from eroding.
        run: pnpm test:cov

      - name: Build
        run: pnpm build

  deploy:
    needs: verify
    # Pull requests verify only; pushes to main ship.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Cloudflare and analytics secrets live in this environment; without
    # this, jobs cannot see them, and the deploy shows up under the
    # environment's deployment history.
    environment: cf-deploy
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Keep in sync with the local pnpm. 11.13.0 was yanked as a broken
          # release and action-setup refuses to install it.
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_PLAUSIBLE_ENDPOINT: ${{ secrets.PUBLIC_PLAUSIBLE_ENDPOINT }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it under Settings -> Secrets and variables -> Actions, on the Secrets tab, then re-run the job."
              exit 1
            fi
          done
          for name in PUBLIC_CF_BEACON_TOKEN PUBLIC_PLAUSIBLE_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is empty; the deployed site ships without it."
            fi
          done

      - name: Build
        env:
          # Inlined into the static HTML at build time, so they must exist
          # here rather than as wrangler vars. The Plausible values ship in
          # the public HTML anyway; the beacon token stays a secret, same as
          # the repo's .env.
          PUBLIC_PLAUSIBLE_ENABLED: 'true'
          PUBLIC_PLAUSIBLE_DOMAIN: npmpulse.com
          PUBLIC_PLAUSIBLE_ENDPOINT: ${{ secrets.PUBLIC_PLAUSIBLE_ENDPOINT }}
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}
        run: pnpm build

      - name: Deploy site worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Keep in sync with the wrangler devDependency.
          wranglerVersion: '4.149.0'
          command: deploy

      - name: Deploy www redirect
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: deploy --config wrangler.www.jsonc
